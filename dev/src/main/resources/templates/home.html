<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Planner</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <header class="app-bar">
        <h1>Trip Planner</h1>
        <a class="button button--tonal" th:href="@{/profile}">Profile</a>
    </header>

    <main class="page page--centered">
        <section class="card card--wide" aria-labelledby="flight-search-title">
            <h2 id="flight-search-title">Find a flight</h2>
            <form class="form" action="#" method="get">
                <div class="field">
                    <label for="departure">From country or airport</label>
                    <input id="departure" name="departure" type="text"
                           placeholder="e.g. Helsinki or Finland" required>
                </div>
                <div class="field">
                    <label for="destination">To country or airport</label>
                    <input id="destination" name="destination" type="text"
                           placeholder="e.g. London or United Kingdom" required>
                </div>
                <button class="button" type="submit">Search flights</button>
            </form>
        </section>
    </main>
</body>
</html>
